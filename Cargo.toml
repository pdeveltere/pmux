[package]
name = "pmux"
version = "0.0.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Agent-aware terminal multiplexer"
repository = "https://github.com/pdeveltere/pmux"

[dependencies]
alacritty_terminal = "0.26"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash", "fontconfig"] }
libc = "0.2"
pollster = "0.4"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.2.1"
tree-sitter = "0.27"
tree-sitter-bash = "0.25.1"
tree-sitter-highlight = "0.27"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.4"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
winit = "0.30"
zeno = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSString", "NSThread", "NSBundle", "NSArray"] }
block2 = "0.5"
objc2-user-notifications = { version = "0.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger"] }
wgpu = { version = "27", default-features = false, features = ["metal", "wgsl", "std"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles", "wgsl", "std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Clippy's defaults plus a curated set of pedantic/nursery lints that catch real bugs or
# needless work. The noisy numeric-cast lints are left off: casts are pervasive in the
# renderer and terminal code and are reviewed by hand. Run `tools/lint.sh`.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
assigning_clones = "warn"
borrow_as_ptr = "warn"
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
elidable_lifetime_names = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
needless_collect = "warn"
needless_pass_by_value = "warn"
needless_raw_string_hashes = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
redundant_closure_for_method_calls = "warn"
ref_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
stable_sort_primitive = "warn"
unchecked_time_subtraction = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
