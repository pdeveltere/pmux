[package]
name = "pmux"
version = "0.0.2"
edition = "2021"

[dependencies]
alacritty_terminal = "0.26"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash", "fontconfig"] }
libc = "0.2"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2.1"
winit = "0.30"
zeno = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["metal", "wgsl", "std"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles", "wgsl", "std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
